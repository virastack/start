allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: true
  lightningcss: true
  msw: false
  sharp: false
  unrs-resolver: false
# eslint-config-next pulls plugins that do not list ESLint 10 yet; their rules were checked on it.
minimumReleaseAgeExclude:
  - knip@6.44.1
  - lucide-react@1.66.0
peerDependencyRules:
  allowedVersions:
    eslint: "10"
