name: CI

on:
  push:
    branches: [main, master]
    paths:
      - "templates/**"
      - "templates-i18n/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "templates/**"
      - "templates-i18n/**"
      - ".github/workflows/ci.yml"

jobs:
  templates:
    name: Template CI (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - templates/nextjs
          - templates/tanstack
          - templates-i18n/nextjs
          - templates-i18n/tanstack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles(format('{0}/package.json', matrix.template)) }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: ${{ matrix.template }}
        run: pnpm install

      - name: Generate Paraglide
        if: contains(matrix.template, 'i18n/tanstack')
        working-directory: ${{ matrix.template }}
        run: pnpm exec paraglide-js compile --project ./project.inlang

      - name: Typecheck
        working-directory: ${{ matrix.template }}
        run: pnpm run typecheck

      - name: Prettier Format Fix
        if: contains(matrix.template, 'i18n/tanstack')
        working-directory: ${{ matrix.template }}
        run: pnpm run format

      - name: Lint
        working-directory: ${{ matrix.template }}
        run: pnpm run lint:ci

      - name: Knip
        working-directory: ${{ matrix.template }}
        run: pnpm run knip

      - name: Test
        working-directory: ${{ matrix.template }}
        run: pnpm run test

      - name: Prepare environment
        working-directory: ${{ matrix.template }}
        run: cp .env.example .env.local

      - name: Build
        working-directory: ${{ matrix.template }}
        run: pnpm run build

